name: Track releases

on:
  schedule:
    # 03:17 UTC = 08:47 IST. GitHub may delay scheduled runs.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-tracker
  cancel-in-progress: false

jobs:
  track:
    # Writes always target the default branch, even if another branch is selected manually.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test tracker
        run: npm test
      - name: Fetch latest releases
        run: npm run track
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changed reports
        env:
          AUTHOR_NAME: ${{ vars.COMMIT_AUTHOR_NAME }}
          AUTHOR_EMAIL: ${{ vars.COMMIT_AUTHOR_EMAIL }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$AUTHOR_NAME" && -z "$AUTHOR_EMAIL" ]]; then
            AUTHOR_NAME='github-actions[bot]'
            AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          elif [[ -z "$AUTHOR_NAME" || -z "$AUTHOR_EMAIL" ]]; then
            echo 'Set both COMMIT_AUTHOR_NAME and COMMIT_AUTHOR_EMAIL, or leave both unset.'
            exit 1
          fi
          git config --local user.name "$AUTHOR_NAME"
          git config --local user.email "$AUTHOR_EMAIL"
          git add -- reports/latest.md reports/releases.json
          if git diff --cached --quiet; then
            echo 'No changes: skipping commit and push.'
            exit 0
          fi
          git commit -m 'docs: update developer tool release report'
          # No force push. Concurrent user changes cause a safe failure; rerun the workflow.
          git push origin "HEAD:$DEFAULT_BRANCH"
